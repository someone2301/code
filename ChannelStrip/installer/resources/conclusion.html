<h2>Installation complete</h2>
<p>To use Channel Strip in Pro Tools, insert Blue Cat PatchWork as an AAX plug-in and load Channel Strip inside it.</p>
<p>If PatchWork does not list the plug-in, add <code>/Library/Audio/Plug-Ins/VST3</code> to its plug-in scan folders and rescan.</p>
