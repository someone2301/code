<html><body style="font-family: -apple-system, Helvetica, sans-serif;">
<h2>Channel Strip</h2>
<p>This installs the Channel Strip VST3 plug-in for all users on this Mac.</p>
<p>Contents: input gain, phase invert, de-esser, 6-band EQ, FET (1176-style) and opto (LA-2A-style) compressor, mono, pan and output gain.</p>
<p>Install location: <code>/Library/Audio/Plug-Ins/VST3/Channel Strip.vst3</code></p>
</body></html>
